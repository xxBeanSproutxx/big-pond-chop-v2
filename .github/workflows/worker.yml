name: worker

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

concurrency:
  group: bpc-worker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.data.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute frames
        run: node worker/compute.mjs
      - name: Commit data
        id: data
        run: |
          git config user.name "bpc-worker" && git config user.email "bpc-worker@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Data commits are authored by GITHUB_TOKEN, which never triggers other
  # workflows — so since the Actions-deploy migration, data refreshes never
  # redeployed the site. Deploy here, reusing the deploy.yml job shape.
  deploy:
    needs: compute
    if: needs.compute.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
