name: sched-probe

# Temporary diagnostic (added 2026-09-24): checks whether GitHub's schedule
# scheduler is firing AT ALL for this repo. Remove once diagnosed.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "sched-probe fired $(date -u)"
